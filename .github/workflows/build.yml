name: Build crackATT v2

on:
  push:
    branches: [main]
    paths:
      - 'tweak/**'
      - 'tweak8011/**'
      - 'vendor/**'
      - 'scripts/build_hybrid_release_8011.py'
      - 'v8.0.11_inputtext/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: /Users/runner/theos
      RELEASE_VERSION: 8.0.11-v4-hybrid
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos and SDK
        run: |
          brew install ldid
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS"
          "$THEOS/bin/update-theos"
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/theos-sdks
          mv /tmp/theos-sdks/*.sdk "$THEOS/sdks/"

      - name: Build tweak (8.5.5)
        run: |
          cd tweak
          make clean 2>/dev/null || true
          make

      - name: Build tweak (8.0.11)
        run: |
          cd tweak8011
          make clean 2>/dev/null || true
          make || (find .theos -name '*.log' -print -exec cat {} \; 2>/dev/null; exit 2)

      - name: Collect artifacts
        run: |
          mkdir -p dist
          DYLIB=$(find tweak/.theos -name 'crackATT.dylib' -type f | head -1)
          test -n "$DYLIB" || (find tweak/.theos && exit 1)
          cp "$DYLIB" dist/crackATT.dylib
          cp tweak/crackATT.plist dist/crackATT.plist
          DYLIB8011=$(find tweak8011/.theos -name 'crackATT.dylib' -type f | head -1)
          test -n "$DYLIB8011" || (find tweak8011/.theos && exit 1)
          cp "$DYLIB8011" dist/crackATT-8011.dylib
          cp tweak8011/crackATT.plist dist/crackATT-8011.plist
          file dist/crackATT.dylib dist/crackATT-8011.dylib
          ls -la dist/

      - name: Build hybrid 8.0.11 .deb
        run: |
          mkdir -p v8.0.11_inputtext/patch releases
          cp dist/crackATT-8011.dylib v8.0.11_inputtext/patch/crackATT.dylib
          python3 scripts/build_hybrid_release_8011.py
          ls -la releases/

      - uses: actions/upload-artifact@v4
        with:
          name: crackATT-v2
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-8011-deb
          path: releases/me.autotouch.autotouch.ios8.inputtext_8.0.11-v4-hybrid_iphoneos-arm64_patched.deb

      - name: Publish GitHub Release 8.0.11-v4-hybrid
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 8.0.11-v4-hybrid
          name: AutoTouch 8.0.11-v4-hybrid
          body: |
            **v4:** ATTweak **alert stub RET** (works before ElleKit loads — fixes lock-screen "License is needed…") + **uicache** in postinst for missing icon.

            ```sh
            export PATH=/var/jb/usr/bin:/var/jb/bin:/usr/bin:/bin
            dpkg -i me.autotouch.autotouch.ios8.inputtext_8.0.11-v4-hybrid_iphoneos-arm64_patched.deb
            ldrestart
            ```
          files: releases/me.autotouch.autotouch.ios8.inputtext_8.0.11-v4-hybrid_iphoneos-arm64_patched.deb
          make_latest: true
          fail_on_unmatched_files: true
